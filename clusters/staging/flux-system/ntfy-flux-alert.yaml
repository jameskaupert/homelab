apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: flux-notification-alert
  namespace: flux-system
spec:
  providerRef:
    name: flux-notification-provider
  eventMetadata:
    summary: "Flux Reconciliation"
  eventSeverity: info
  eventSources:
    - kind: GitRepository
      name: '*'
    - kind: Kustomization
      name: '*'
