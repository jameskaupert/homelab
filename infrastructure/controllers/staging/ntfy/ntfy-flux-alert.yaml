apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: flux-notification-alert
  namespace: ntfy
spec:
  summary: "Flux Reconciliation Failure"
  providerRef:
    name: flux-notification-provider
  eventSeverity: error
  eventSources:
    - kind: GitRepository
      name: '*'
    - kind: Kustomization
      name: '*'
