apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ntfy
resources:
  - ../../base/ntfy/
  - ntfy-deployment.yaml
  - ntfy-svc.yaml
  - ntfy-pvc.yaml
  - ntfy-ingress.yaml
  - ntfy-flux-provider.yaml
  - ntfy-flux-alert.yaml
  - ntfy-flux-failure-test.yaml
configMapGenerator:
    - name: server-config
      files: 
        - server.yaml
